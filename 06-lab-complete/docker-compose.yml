services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      PORT: "${PORT:-8000}"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  redis-data:

services:
  - type: web
    name: day14-cp6-agent
    runtime: docker
    region: singapore
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-cp6-redis
          property: connectionString

  - type: keyvalue
    name: day14-cp6-redis
    region: singapore
    plan: free
    ipAllowList: []
